  question: How many grams of Ammonia (molecular weight = 17) are required to produce
    80 millilitres of a 2.5 molar solution? Please give your answer to 1 decimal place.
  answer: 3.4
  solution: |-
    Convert volume to litres:<br />
    80 ml = 0.08 L<br /><br />
    Moles = molarity × volume<br />
    = 2.5 × 0.08<br />
    = 0.2 mol<br /><br />
    Mass = moles × molecular weight<br />
    = 0.2 × 17<br />
    = 3.4 g<br /><br />
    Answer to 1 decimal place = 3.4 g
