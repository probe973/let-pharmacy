    What is the new cost of the drug? Give the answer correct to 2 decimal places.
  answer: 560.0
  solution: |2-
     **Answer** Find 20 percent: <br />
     \( \frac{20}{100} \times 700 = 140.0 \) <br />
    Subtract: <br />
     \( 700 - 140.0 = 560.0 \)
