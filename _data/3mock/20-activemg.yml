- id: 20001
  question: A liquid medication contains 0.5 % active ingredient. How many milligrams
    would there be in a 78 ml dose?
  answer: 390
  solution: |-
    0.5 % of 78 ml is <br />
    \( \frac{0.5}{100} \times 78 = 0.39\) <br />
    This is 0.39 g, so convert to mg: <br />
    \( 0.39 \times 1000 = 390 \) <br />
    390 mg
